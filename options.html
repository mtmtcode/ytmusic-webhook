<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YouTube Music Webhook 設定</title><link rel="stylesheet" href="options.css"></head>
<body><main>
<h1>YouTube Music Webhook</h1>
<p>曲が変わったとき、送信先ごとのJSONでPOSTします。LaMetric TIMEにも直接送れます。</p>
<form id="settings">
<label class="toggle"><input id="enabled" type="checkbox">通知をONにする（全送信先）</label>
<div id="targets"></div>
<div class="buttons"><button type="button" id="add-webhook">＋ Webhook</button><button type="button" id="add-lametric">＋ LaMetric</button></div>
<p class="hint">最大20件。追加・変更・削除は「すべて保存」で反映されます。</p>
<button type="submit" id="save">すべて保存</button>
</form>
<p id="result" role="status" aria-live="polite"></p>
<h2>送信状況</h2><div id="delivery" aria-live="polite"></div>
<p class="hint">保存・テスト時に、入力したホストだけのHTTP(S)接続権限を要求します。認証情報はこのPCのローカル領域に保存されます。HTTP通信は暗号化されません。</p>
</main>
<template id="target-card"><section class="target">
<div class="card-heading"><h2>送信先</h2><button class="remove secondary" type="button">削除</button></div>
<label>名前<input data-field="name" maxlength="80" autocomplete="off"></label>
<label>プリセット<select data-field="preset"><option value="webhook">汎用Webhook</option><option value="lametric">LaMetric TIME</option></select></label>
<label class="toggle"><input data-field="enabled" type="checkbox">この送信先を有効にする</label>
<label>POST先URL<input data-field="url" type="url" spellcheck="false" autocomplete="off"></label>
<p class="lametric-hint hint">LaMetric： http://ホスト:8080/api/v2/device/notifications</p>
<label>認証<select data-field="authType"><option value="none">なし</option><option value="basic">Basic</option><option value="bearer">Bearerトークン</option></select></label>
<div class="basic-fields"><label>ユーザー名<input data-field="username" autocomplete="off" spellcheck="false"></label><label class="password-label"><span>パスワード</span><input data-field="password" type="password" autocomplete="off" spellcheck="false"></label></div>
<div class="bearer-fields"><label>Bearerトークン<input data-field="token" type="password" autocomplete="off" spellcheck="false"></label></div>
<label>JSONテンプレート<textarea data-field="template" rows="10" spellcheck="false"></textarea></label>
<p class="hint">使用可能： {{title}} / {{artist}} / {{text}} / {{source}}。変数はJSON文字列内に書きます。LaMetricのループ回数はJSON内の cycles を直接変更してください。</p>
<details><summary>サンプル曲で送信JSONを確認</summary><pre class="preview"></pre></details>
<button class="test secondary" type="button">接続テスト</button>
<p class="test-hint hint"></p><p class="test-result" role="status"></p>
</section></template>
<script type="module" src="options.js"></script></body></html>
